name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. ኮዱን ማውረድ (Checkout repository)
        uses: actions/checkout@v4

      - name: 2. ጃቫን ማዘጋጀት (Setup Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Flutter ማዘጋጀት (Setup Flutter)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. የጎደሉ የአንድሮይድ ፋይሎችን በራስ-ሰር ማመንጨት (Recreate Android folder)
        run: |
          flutter create . --platforms=android --org com.felegetibeb.app
          # የኢንተርኔት ፈቃድ ወደ AndroidManifest ማከል
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: 5. ፓኬጆችን መጫን (Get Dependencies)
        run: flutter pub get

      - name: 6. APK መገንባት (Build Release APK)
        run: flutter build apk --release

      - name: 7. የተሰራውን APK ወደ GitHub ማውጫ ማዘጋጀት (Upload APK)
        uses: actions/upload-artifact@v4
        with:
          name: Felege-Tibeb-Mezmur-App
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
