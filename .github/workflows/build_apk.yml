name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. ኮዱን ማውረድ
        uses: actions/checkout@v4

      - name: 2. ጃቫን ማዘጋጀት
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Flutter ማዘጋጀት
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. የአንድሮይድ ፕሮጀክት ማመንጨት
        run: |
          # ፋይሎችን Backup ማድረግ
          cp pubspec.yaml pubspec.yaml.bak
          [ -f lib/main.dart ] && cp lib/main.dart lib/main.dart.bak

          # --no-pub በማከል አንድሮይድ ፎልደር ማመንጨት
          flutter create . --no-pub --project-name felege_tibeb_mezmur --platforms=android --org com.felegetibeb.app

          # ትክክለኛውን pubspec እና main.dart መልሶ መተካት
          mv pubspec.yaml.bak pubspec.yaml
          [ -f lib/main.dart.bak ] && mv lib/main.dart.bak lib/main.dart

          # የኢንተርኔት ፈቃድ ማከል
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml || true

          # ለአዲሱ build.gradle.kts እና ለቀደመው build.gradle minSdkVersion 21 ማስተካከል
          sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle || true

      - name: 5. ጥገኞችን መጫን
        run: flutter pub get

      - name: 6. APK መገንባት
        run: flutter build apk --release

      - name: 7. APK ፋይሉን ማስቀመጥ
        uses: actions/upload-artifact@v4
        with:
          name: Felege-Tibeb-Mezmur-App
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
