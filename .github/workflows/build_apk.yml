class MezmurCatalogScreen extends StatelessWidget {
  const MezmurCatalogScreen({super.key});

  @override
  Widget build(BuildContext context) {
    final state = StateScope.of(context);

    return ListView.builder(
      padding: const EdgeInsets.fromLTRB(16, 12, 16, 90),
      itemCount: state.mezmurs.length,
      itemBuilder: (context, i) {
        final mezmur = state.mezmurs[i];
        return Container(
          margin: const EdgeInsets.only(bottom: 12),
          decoration: BoxDecoration(
            color: const Color(0xFF1B1417),
            borderRadius: BorderRadius.circular(14),
            border: Border.all(color: const Color(0xFF2E2429)),
          ),
          child: ListTile(
            leading: ClipRRect(
              borderRadius: BorderRadius.circular(8),
              child: Image.network(mezmur.coverUrl, width: 48, height: 48, fit: BoxFit.cover),
            ),
            title: Text(mezmur.title, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
            subtitle: Text('${mezmur.singer} • ${mezmur.category}', style: const TextStyle(fontSize: 12, color: Colors.white54)),
            trailing: Row(
              mainAxisSize: MainAxisSize.min,
              children: [
                IconButton(
                  icon: Icon(mezmur.isFavorite ? Icons.favorite_rounded : Icons.favorite_border_rounded),
                  color: mezmur.isFavorite ? const Color(0xFFDC2626) : Colors.white54,
                  onPressed: () => state.toggleFavorite(mezmur),
                ),
                IconButton(
                  icon: const Icon(Icons.play_circle_fill_rounded, color: Color(0xFFD4AF37), size: 32),
                  onPressed: () => state.playMezmur(mezmur),
                ),
              ],
            ),
          ),
        );
      },
    );
  }
}

class PoemsCatalogScreen extends StatelessWidget {
  const PoemsCatalogScreen({super.key});

  @override
  Widget build(BuildContext context) {
    final state = StateScope.of(context);

    return ListView.builder(
      padding: const EdgeInsets.fromLTRB(16, 12, 16, 90),
      itemCount: state.poems.length,
      itemBuilder: (context, i) {
        final poem = state.poems[i];
        return Card(
          color: const Color(0xFF1B1417),
          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16), side: const BorderSide(color: Color(0xFF2E2429))),
          margin: const EdgeInsets.only(bottom: 14),
          child: ListTile(
            title: Text(poem.title, style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFFD4AF37))),
            subtitle: Text('ደራሲ፦ ${poem.author}\n${poem.content.split('\n').first}...', maxLines: 2),
            trailing: const Icon(Icons.arrow_forward_ios_rounded, size: 14, color: Colors.white54),
            onTap: () {
              Navigator.push(
                context,
                MaterialPageRoute(builder: (_) => PoemDetailView(poem: poem)),
              );
            },
          ),
        );
      },
    );
  }
}

class PoemDetailView extends StatelessWidget {
  final SpiritualPoem poem;
  const PoemDetailView({super.key, required this.poem});

  @override
  Widget build(BuildContext context) {
    final state = StateScope.of(context);

    return Scaffold(
      appBar: AppBar(title: Text(poem.title)),
      body: SingleChildScrollView(
        padding: const EdgeInsets.all(22),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Text(poem.title, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Color(0xFFD4AF37))),
            const SizedBox(height: 6),
            Text('ደራሲ፦ ${poem.author}', style: const TextStyle(color: Colors.white70)),
            const Divider(height: 28, color: Colors.white24),
            if (poem.audioRecitationUrl != null) ...[
              ElevatedButton.icon(
                style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFD4AF37), foregroundColor: Colors.black),
                icon: const Icon(Icons.play_arrow_rounded),
                label: const Text('የግጥሙን ድምፅ አዳምጥ'),
                onPressed: () => state.playPoemAudio(poem),
              ),
              const SizedBox(height: 20),
            ],
            Text(poem.content, style: const TextStyle(fontSize: 17, height: 2.0, color: Color(0xFFE5E7EB))),
          ],
        ),
      ),
    );
  }
}

// ==========================================
// 6. ገጽ 3፡ የእኔ ማህደር
// ==========================================

class UserLibraryScreen extends StatelessWidget {
  const UserLibraryScreen({super.key});

  @override
  Widget build(BuildContext context) {
    final state = StateScope.of(context);
    final favMezmurs = state.mezmurs.where((m) => m.isFavorite).toList();

    return favMezmurs.isEmpty
        ? const Center(child: Text('ምንም የተወደደ መዝሙር አልተገኘም።', style: TextStyle(color: Colors.white54)))
        : ListView.builder(
            padding: const EdgeInsets.all(16),
            itemCount: favMezmurs.length,
            itemBuilder: (ctx, i) {
              final m = favMezmurs[i];
              return ListTile(
                title: Text(m.title),
                subtitle: Text(m.singer),
                trailing: IconButton(
                  icon: const Icon(Icons.play_circle_fill, color: Color(0xFFD4AF37)),
                  onPressed: () => state.playMezmur(m),
                ),
              );
            },
          );
  }
}

// ==========================================
// 7. ገጽ 4፡ ተጨማሪ ክፍሎች & የአድሚን መግቢያ
// ==========================================

class MoreMenuScreen extends StatelessWidget {
  const MoreMenuScreen({super.key});

  void _openAdminLogin(BuildContext context) {
    final pwdCtrl = TextEditingController();
    showDialog(
      context: context,
      builder: (ctx) => AlertDialog(
        backgroundColor: const Color(0xFF1B1417),
        title: const Text('የአድሚን መግቢያ', style: TextStyle(color: Color(0xFFD4AF37))),
        content: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            const Text('አዳዲስ መዝሙራትና ግጥሞችን ለመጫን የአድሚን የይለፍ ቃል ያስገቡ።'),
            const SizedBox(height: 12),
            TextField(
              controller: pwdCtrl,
              obscureText: true,
              decoration: const InputDecoration(
                labelText: 'የይለፍ ቃል (Password)',
                hintText: '1234',
                border: OutlineInputBorder(),
              ),
            ),
          ],
        ),
        actions: [
          TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('ተመለስ')),
          ElevatedButton(
            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFD4AF37), foregroundColor: Colors.black),
            onPressed: () {
              // ነባሪ የይለፍ ቃል: 1234
              if (pwdCtrl.text == '1234') {
                Navigator.pop(ctx);
                Navigator.push(context, MaterialPageRoute(builder: (_) => const AdminDashboardScreen()));
              } else {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('የተሳሳተ የይለፍ ቃል ነው! (ትክክለኛው: 1234)')),
                );
              }
            },
            child: const Text('ግባ'),
          ),
        ],
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return ListView(
      padding: const EdgeInsets.all(16),
      children: [
        // የአድሚን መቆጣጠሪያ ማስገቢያ ቁልፍ
        Container(
          margin: const EdgeInsets.only(bottom: 12),
          decoration: BoxDecoration(
            color: const Color(0xFF2E1A22),
            borderRadius: BorderRadius.circular(14),
            border: Border.all(color: const Color(0xFFD4AF37)),
          ),
          child: ListTile(
            leading: const Icon(Icons.admin_panel_settings_rounded, color: Color(0xFFD4AF37), size: 30),
            title: const Text('የአድሚን መቆጣጠሪያ ገጽ (Admin Panel)', style: TextStyle(fontWeight: FontWeight.bold, color: Color(0xFFD4AF37))),
            subtitle: const Text('መዝሙር፣ ግጥምና ድምፅ ለመጨመር/ለማስተዳደር', style: TextStyle(fontSize: 12, color: Colors.white70)),
            trailing: const Icon(Icons.lock_open_rounded, size: 18, color: Color(0xFFD4AF37)),
            onTap: () => _openAdminLogin(context),
          ),
        ),
        const Divider(color: Colors.white24, height: 24),
        _menuTile(Icons.church_rounded, 'ስለ እኛ (About Us)', 'የሰንበት ት/ቤቱ አመሠራረትና አገልግሎት'),
        _menuTile(Icons.contact_phone_rounded, 'ያግኙን (Contact Us)', 'ስልክ፣ ቴሌግራም እና አድራሻ'),
        _menuTile(Icons.help_outline_rounded, 'ተደጋጋሚ ጥያቄዎች (FAQ)', 'ስለ መተግበሪያው አጠቃቀም ማብራሪያ'),
      ],
    );
  }

  Widget _menuTile(IconData icon, String title, String subtitle) {
    return Container(
      margin: const EdgeInsets.only(bottom: 10),
      decoration: BoxDecoration(
        color: const Color(0xFF1B1417),
        borderRadius: BorderRadius.circular(14),
        border: Border.all(color: const Color(0xFF2E2429)),
      ),
      child: ListTile(
        leading: Icon(icon, color: const Color(0xFFD4AF37)),
        title: Text(title, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
        subtitle: Text(subtitle, style: const TextStyle(fontSize: 12, color: Colors.white54)),
      ),
    );
  }
}

// ==========================================
// 8. አድሚን መዝሙርና ግጥም የሚጨምርበት ገጽ
// ==========================================

class AdminDashboardScreen extends StatelessWidget {
  const AdminDashboardScreen({super.key});

  void _showAddMezmurDialog(BuildContext context, AppState state) {
    final titleCtrl = TextEditingController();
    final singerCtrl = TextEditingController();
    final audioUrlCtrl = TextEditingController();
    final lyricsCtrl = TextEditingController();

    showDialog(
      context: context,
      builder: (ctx) => AlertDialog(
        backgroundColor: const Color(0xFF1B1417),
        title: const Text('አዲስ መዝሙር መጫኛ', style: TextStyle(color: Color(0xFFD4AF37))),
        content: SingleChildScrollView(
          child: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              TextField(controller: titleCtrl, decoration: const InputDecoration(labelText: 'የመዝሙሩ ርዕስ*')),
              const SizedBox(height: 8),
              TextField(controller: singerCtrl, decoration: const InputDecoration(labelText: 'መዘምራን / ዘማሪ*')),
              const SizedBox(height: 8),
              TextField(controller: audioUrlCtrl, decoration: const InputDecoration(labelText: 'የድምፅ ሊንክ (Audio MP3 URL)*', hintText: 'https://.../song.mp3')),
              const SizedBox(height: 8),
              TextField(controller: lyricsCtrl, maxLines: 4, decoration: const InputDecoration(labelText: 'የመዝሙሩ ሙሉ ግጥም*')),
            ],
          ),
        ),
        actions: [
          TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('ይቅር')),
          ElevatedButton(
            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFD4AF37), foregroundColor: Colors.black),
            onPressed: () {
              if (titleCtrl.text.isNotEmpty) {
                state.addMezmur(
                  Mezmur(
                    id: DateTime.now().millisecondsSinceEpoch.toString(),
                    title: titleCtrl.text,
                    singer: singerCtrl.text.isEmpty ? 'ፈለገ ጥበብ ሰ/ት/ቤት' : singerCtrl.text,
                    category: 'የተጨመረ',
                    audioUrl: audioUrlCtrl.text.isEmpty
                        ? 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3'
                        : audioUrlCtrl.text,
                    coverUrl: 'https://images.unsplash.com/photo-1548625361-195fe578491c?w=500',
                    lyrics: lyricsCtrl.text.isEmpty ? 'ግጥም አልተካተተም' : lyricsCtrl.text,
                  ),
                );
                Navigator.pop(ctx);
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('መዝሙሩ በተሳካ ሁኔታ ተጭኗል!')),
                );
              }
            },
            child: const Text('መዝግብ'),
          ),
        ],
      ),
    );
  }

  void _showAddPoemDialog(BuildContext context, AppState state) {
    final titleCtrl = TextEditingController();
    final authorCtrl = TextEditingController();
    final contentCtrl = TextEditingController();
    final audioUrlCtrl = TextEditingController();

    showDialog(
      context: context,
      builder: (ctx) => AlertDialog(
        backgroundColor: const Color(0xFF1B1417),
        title: const Text('አዲስ መንፈሳዊ ግጥም መጫኛ', style: TextStyle(color: Color(0xFFD4AF37))),
        content: SingleChildScrollView(
          child: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              TextField(controller: titleCtrl, decoration: const InputDecoration(labelText: 'የግጥሙ ርዕስ*')),
              const SizedBox(height: 8),
              TextField(controller: authorCtrl, decoration: const InputDecoration(labelText: 'ደራሲ')),
              const SizedBox(height: 8),
              TextField(controller: audioUrlCtrl, decoration: const InputDecoration(labelText: 'የድምፅ ንባብ ሊንክ (አማራጭ)', hintText: 'https://.../audio.mp3')),
              const SizedBox(height: 8),
              TextField(controller: contentCtrl, maxLines: 5, decoration: const InputDecoration(labelText: 'የግጥሙ ስንኞች*')),
            ],
          ),
        ),
        actions: [
          TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('ይቅር')),
          ElevatedButton(
            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFD4AF37), foregroundColor: Colors.black),
            onPressed: () {
              if (titleCtrl.text.isNotEmpty) {
                state.addPoem(
                  SpiritualPoem(
                    id: DateTime.now().millisecondsSinceEpoch.toString(),
                    title: titleCtrl.text,
                    author: authorCtrl.text.isEmpty ? 'የሰንበት ት/ቤት አባል' : authorCtrl.text,
                    category: 'መንፈሳዊ ግጥም',
                    content: contentCtrl.text,
                    audioRecitationUrl: audioUrlCtrl.text.isEmpty ? null : audioUrlCtrl.text,
                  ),
                );
                Navigator.pop(ctx);
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('ግጥሙ በተሳካ ሁኔታ ተመዝግቧል!')),
                );
              }
            },
            child: const Text('መዝግብ'),
          ),
        ],
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    final state = StateScope.of(context);

    return Scaffold(
      appBar: AppBar(title: const Text('የአድሚን ዳሽቦርድ')),
      body: Padding(
        padding: const EdgeInsets.all(16),
        child: Column(
          children: [
            Row(
              children: [
                Expanded(
                  child: ElevatedButton.icon(
                    style: ElevatedButton.styleFrom(
                      backgroundColor: const Color(0xFFD4AF37),
                      foregroundColor: Colors.black,
                      padding: const EdgeInsets.symmetric(vertical: 14),
                    ),
                    icon: const Icon(Icons.music_note_rounded),
                    label: const Text('መዝሙር ጫን'),
                    onPressed: () => _showAddMezmurDialog(context, state),
                  ),
                ),
                const SizedBox(width: 10),
                Expanded(
                  child: ElevatedButton.icon(
                    style: ElevatedButton.styleFrom(
                      backgroundColor: const Color(0xFF991B1B),
                      foregroundColor: Colors.white,
                      padding: const EdgeInsets.symmetric(vertical: 14),
                    ),
                    icon: const Icon(Icons.edit_note_rounded),
                    label: const Text('ግጥም ጫን'),
                    onPressed: () => _showAddPoemDialog(context, state),
                  ),
                ),
              ],
            ),
            const SizedBox(height: 20),
            const Align(
              alignment: Alignment.centerLeft,
              child: Text('በአሁኑ ሰዓት በመተግበሪያው ላይ ያሉ መዝሙራት', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
            ),
            const SizedBox(height: 10),
            Expanded(
              child: ListView.builder(
                itemCount: state.mezmurs.length,
                itemBuilder: (ctx, i) {
                  final m = state.mezmurs[i];
                  return Card(
                    color: const Color(0xFF1B1417),
                    child: ListTile(
                      title: Text(m.title, style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: Text(m.singer),
                      trailing: IconButton(
                        icon: const Icon(Icons.delete_forever_rounded, color: Colors.redAccent),
                        onPressed: () => state.deleteMezmur(m.id),
                      ),
                    ),
                  );
                },
              ),
            ),
          ],
        ),
      ),
    );
  }
}
