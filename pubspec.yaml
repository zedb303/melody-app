name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. ኮዱን ማውረድ
        uses: actions/checkout@v4

      - name: 2. ጃቫን ማዘጋጀት (Java 17 with setup-java v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Flutter ማዘጋጀት
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. የአንድሮይድ ፕሮጀክት ማመንጨት (Fixed Project Name)
        run: |
          flutter create . --project-name felege_tibeb_mezmur --platforms=android --org com.felegetibeb.app
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml || true

      - name: 5. ጥገኞችን መጫን (Get packages)
        run: flutter pub get

      - name: 6. APK መገንባት (Build APK)
        run: flutter build apk --release

      - name: 7. APK ፋይሉን ማውጫ ማዘጋጀት (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Felege-Tibeb-Mezmur-App
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
